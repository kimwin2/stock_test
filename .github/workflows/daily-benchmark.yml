name: Daily Benchmark (관심종목 대조)

# 매일 저녁, 참고 채널의 그날 관심종목이 우리 수급탭 후보와 얼마나 겹쳤는지
# 재고, 빗나간 종목마다 **어느 관문에서 떨어졌는지**를 리포트로 남긴다.
#
# 왜 저녁인가: flow 는 평일 8~20시(KST)에 돌고 마지막 실행이 그날의 확정본이다.
# 그 전에 재면 장중 스냅샷으로 채점하게 된다.
#
# 왜 GitHub Actions 인가: 세션 기반 스케줄러는 세션이 끝나면 같이 죽는다.
# 매일 도는 것은 레포에 있어야 한다.
#
# 결과는 Actions 로그 + Job Summary + 아티팩트로 남는다. 레퍼런스 문장·수치는
# 제품(S3 산출물·사용자 화면)에 절대 들어가지 않는다 — 평가용 정답지일 뿐이다.

on:
  schedule:
    - cron: '35 11 * * MON-FRI'   # KST 20:35 — flow 마지막 실행(20:00) 이후
  workflow_dispatch:
    inputs:
      date:
        description: '대조할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false
      days:
        description: '누적 표본 일수'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 전체 requirements 는 Lambda 용이라 무겁다. 대조에 실제로 필요한 것만.
      #   KRX 상장 목록 조회 → finance-datareader
      #   번들 복호화        → cryptography
      #
      # 2026-08-20: 여기에 **import 이름**(`FinanceDataReader`)을 적어놔서
      # PyPI 에 없는 배포를 찾다가 `No matching distribution found` 로 죽었다.
      # 5회 예약 실행이 전부 이 줄에서 멈췄고, 그 결과 대조는 **한 번도 돈 적이
      # 없다.** 배포 이름은 `finance-datareader` 다 (requirements.txt 는 처음부터
      # 맞게 적혀 있었는데 이 파일만 틀렸다).
      #
      # 그리고 **의존성 하나 때문에 그날 기록을 통째로 잃으면 안 된다.**
      # 둘 다 없어도 대조는 의미 있는 리포트를 낸다:
      #   cryptography 없음        → '레퍼런스 없음' (ensure_reference 가 흡수)
      #   finance-datareader 없음  → 국내/해외 구분만 생략하고 그렇게 적는다
      # 그래서 continue-on-error 로 둔다. 설치 실패는 아래 스텝이 리포트에 적는다.
      - name: Install deps
        id: deps
        continue-on-error: true
        run: pip install --quiet finance-datareader cryptography

      - name: Check optional deps
        id: depcheck
        shell: bash
        run: |
          missing=""
          python -c "import FinanceDataReader" 2>/dev/null || missing="$missing finance-datareader"
          python -c "import cryptography"      2>/dev/null || missing="$missing cryptography"
          if [ -n "$missing" ]; then
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::warning::설치 실패한 의존성:$missing — 리포트가 축소된 상태로 나온다"
          else
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "의존성 정상"
          fi

      - name: Run daily check
        id: check
        env:
          # stock_chat 의 공개 배포 번들(GitHub Pages 의 core.enc)을 여는 공유 암호.
          # stock_chat 레포 시크릿의 SHARE_PASSPHRASE 와 같은 값이어야 한다.
          # 미설정이면 '레퍼런스 없음' 리포트가 나오고 잡은 통과한다
          # (실패로 두면 매일 빨간 X 만 쌓이고 아무도 안 본다).
          SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
          # 번들 베이스 주소. 기본값(kimwin2.github.io/stock_chat)과 다를 때만 넣는다.
          STOCK_CHAT_BUNDLE_URL: ${{ vars.STOCK_CHAT_BUNDLE_URL }}
          # 레퍼런스를 어딘가로 따로 실어 나를 때의 우회로 (`<base>/YYYY-MM-DD.json`).
          # 번들 경로가 붙어 있으면 쓰이지 않는다.
          REFERENCE_DAILY_URL: ${{ secrets.REFERENCE_DAILY_URL }}
        shell: bash
        run: |
          cd backend
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-5}"
          set +e
          python -m benchmark.daily_check $DATE_ARG --days "$DAYS" --out ../benchmark-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish to job summary
        if: always()
        run: |
          if [ -n "${{ steps.depcheck.outputs.missing }}" ]; then
            {
              echo "> ⚠️ 설치 실패한 의존성:${{ steps.depcheck.outputs.missing }}"
              echo ">"
              echo "> 리포트가 축소된 상태다. 이 줄이 보이면 먼저 이것부터 고칠 것."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f benchmark-report.md ]; then
            cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '대조 리포트가 생성되지 않았다. 위 스텝 로그를 볼 것.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.md
          if-no-files-found: ignore
          retention-days: 90
