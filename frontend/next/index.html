<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
  <title>오늘의 장 — 수급·테마 대시보드</title>
  <meta name="description" content="오늘 사도 되는 장인지, 어디가 강한지, 뭘 볼지. 세 가지를 한 화면에서.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="data:,">
</head>
<body>

<!-- ══ 상단 바 — 얇게. 첫 화면 세로를 헤더가 먹지 않게 한다 ══ -->
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <button class="tb-brand" id="btn-home" type="button" aria-label="오늘 화면으로">
      <span class="tb-mark" aria-hidden="true"></span>
      <span class="tb-title" id="tb-title">오늘의 장</span>
    </button>
    <div class="tb-right">
      <!-- 갱신 시각은 표시만 하는 글자가 아니라 '다시 받기' 버튼이다.
           데이터가 오래됐다는 걸 보여주면서 손쓸 방법이 없으면 막다른 길이 된다. -->
      <button class="tb-stamp" id="tb-stamp" type="button" aria-label="데이터 다시 받기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.7 4.2"/><path d="M20 5v6h-6"/></svg>
        <span id="tb-stamp-txt">—</span>
      </button>
      <button class="icon-btn" id="btn-search" type="button" aria-label="종목 검색">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="밝게/어둡게 전환">
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ══ 본문 ══ -->
<main id="view" class="view" tabindex="-1"></main>

<!-- ══ 하단 탭바 — 엄지 도달 범위 ══ -->
<nav class="tabbar" id="tabbar" aria-label="주요 화면">
  <button class="tabbtn is-on" data-route="home" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.6 10v9.2h12.8V10"/></svg>
    <span>오늘</span>
  </button>
  <button class="tabbtn" data-route="stocks" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9.5M9.3 19V5M14.7 19v-7.5M20 19V8"/></svg>
    <span>종목</span>
  </button>
  <button class="tabbtn" data-route="themes" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="8" height="8" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.4"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.4"/><rect x="3.5" y="13.5" width="8" height="7" rx="1.4"/></svg>
    <span>테마</span>
  </button>
  <button class="tabbtn" data-route="watch" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.8l2.3 4.7 5.2.8-3.75 3.65.9 5.15L12 16.65 7.35 19.1l.9-5.15L4.5 10.3l5.2-.8z"/></svg>
    <span>관심</span>
    <b class="tab-dot" id="watch-dot" hidden></b>
  </button>
</nav>

<!-- ══ 바텀시트 (종목 상세 · 용어 설명 공용) ══ -->
<div class="sheet-root" id="sheet" hidden>
  <div class="sheet-scrim" data-sheet-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="sheet-x" data-sheet-close type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>

<!-- ══ 전체화면 검색 ══ -->
<div class="search-root" id="search" hidden>
  <div class="search-head">
    <button class="icon-btn" id="search-back" type="button" aria-label="검색 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input type="search" id="search-input" placeholder="종목명 또는 코드" autocomplete="off"
           enterkeyhint="search" spellcheck="false" aria-label="종목 검색">
    <button class="icon-btn" id="search-clear" type="button" aria-label="입력 지우기" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="search-body" id="search-body"></div>
</div>

<!-- ══ 전체화면 캔들 차트 ══ -->
<div class="full-root" id="fullchart" hidden>
  <div class="full-head">
    <button class="icon-btn" id="full-back" type="button" aria-label="차트 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="full-id"><b id="full-name">—</b><span id="full-code"></span></div>
    <div class="seg seg-sm" id="full-tf" role="group" aria-label="차트 기간"></div>
  </div>
  <div class="full-body" id="full-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
  // 차트 API endpoint — 기존 화면(frontend/index.html)과 동일한 값.
  // sam deploy 출력의 ChartApiUrl. 바꿀 땐 두 파일 모두 고쳐야 한다.
  window.STOCK_CHART_API_URL = 'https://ygtkn3gw4pdbvjc7ezjwlq2wyu0wropa.lambda-url.ap-northeast-2.on.aws/';
</script>
<script src="js/core.js"></script>
<script src="js/viz.js"></script>
<script src="js/supply.js"></script>
<script src="js/ui.js"></script>
<script src="js/detail.js"></script>
<script src="js/home.js"></script>
<script src="js/stocks.js"></script>
<script src="js/themes.js"></script>
<script src="js/watch.js"></script>
<script src="js/app.js"></script>
</body>
</html>
